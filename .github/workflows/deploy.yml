name: Test and deploy

on:
  push:
    # Tests run on both; only the default branch actually deploys (see below).
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# One run at a time PER BRANCH. Scoped by ref deliberately: with a single
# shared group, pushing two branches close together made the test-only run on
# one cancel the deploying run on the other, so a deploy could silently never
# happen. Only the default branch deploys, so per-ref scoping still leaves at
# most one deployment in flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Logic tests
        run: npm test

      # Only Chromium: the app targets iOS Safari and Android Chrome, and
      # WebKit on Linux is not the same engine as Safari on iOS anyway - so it
      # would add CI minutes without adding confidence.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:browser

  deploy:
    needs: test
    # Deploy only from the repository's DEFAULT branch, whatever it is called.
    #
    # The github-pages environment carries a branch protection rule permitting
    # deployments from the default branch only. Hardcoding `main` here fails
    # with "Branch is not allowed to deploy to github-pages due to environment
    # protection rules" whenever main is not actually the default - which is
    # exactly what happens on a repo whose first pushed branch was something
    # else. Comparing against the live default fixes it today and keeps working
    # after the default is switched, with no edit to this file.
    #
    # TEMPORARY second clause. The github-pages *environment* keeps its own
    # allowed-branches list, and it was created while claude/build-from-spec-4rap35
    # was the repository default. Changing the default to main did NOT update
    # that list, so deploys from main are refused before the job even starts
    # (a failed job with no logs at all - the giveaway).
    #
    # TO REMOVE THIS: Settings -> Environments -> github-pages ->
    # "Deployment branches and tags" -> add `main` (or switch it to
    # "No restriction"). Then delete the second clause below and deploys run
    # from the default branch alone, as intended.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == 'claude/build-from-spec-4rap35')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # There is no build step. The repository root IS the site, which is the
      # main reason this app has no toolchain to keep alive.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
