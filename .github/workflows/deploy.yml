name: Test and deploy

on:
  push:
    # Tests run on both; only the default branch actually deploys (see below).
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# One run at a time PER BRANCH. Scoped by ref deliberately: with a single
# shared group, pushing two branches close together made the test-only run on
# one cancel the deploying run on the other, so a deploy could silently never
# happen. Only the default branch deploys, so per-ref scoping still leaves at
# most one deployment in flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Logic tests
        run: npm test

      # Only Chromium: the app targets iOS Safari and Android Chrome, and
      # WebKit on Linux is not the same engine as Safari on iOS anyway - so it
      # would add CI minutes without adding confidence.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:browser

  deploy:
    needs: test
    # Deploy only from the repository's DEFAULT branch, whatever it is called.
    #
    # The github-pages environment carries a branch protection rule permitting
    # deployments from the default branch only. Hardcoding `main` here fails
    # with "Branch is not allowed to deploy to github-pages due to environment
    # protection rules" whenever main is not actually the default - which is
    # exactly what happens on a repo whose first pushed branch was something
    # else. Comparing against the live default fixes it today and keeps working
    # after the default is switched, with no edit to this file.
    #
    # The github-pages *environment* additionally keeps its own allowed-branches
    # list (Settings -> Environments -> github-pages -> "Deployment branches
    # and tags"), and `main` must be on it - branch rules there are
    # case-sensitive. A refusal shows as a failed deploy job with no logs at
    # all: that absence is the giveaway.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Writes the commit into the app so a phone can say exactly which build
      # it is running, and so every deploy gets its own service worker cache.
      # There is still no build step - this is a substitution, not a compiler.
      - name: Stamp the build
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/__BUILD_SHA__/$SHA/g; s/__BUILD_DATE__/$DATE/g" src/version.js sw.js
          grep -q "$SHA" src/version.js || { echo "version.js was not stamped"; exit 1; }
          grep -q "$SHA" sw.js || { echo "sw.js was not stamped"; exit 1; }

      # There is no build step. The repository root IS the site, which is the
      # main reason this app has no toolchain to keep alive.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
