name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: migrations + isolation suite
    runs-on: ubuntu-latest

    # The tenant-isolation invariant is the product's core security property,
    # so it is verified against a real Postgres on every change rather than
    # trusted to review.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: family_dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - run: npm ci

      # Applies the local shim plus every migration in order. Fails the build on
      # any SQL error, so a broken migration cannot merge.
      - name: Apply migrations
        run: ./scripts/db-reset.sh

      - name: RLS isolation suite
        run: ./scripts/test-rls.sh

      - name: Export worker tests
        run: npm run test:core
